{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 500px;">
  <h2>Register</h2>
  {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
  <form method="post" action="{% url 'onlinecourse:registration' %}">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">First Name</label>
      <input type="text" name="firstname" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Last Name</label>
      <input type="text" name="lastname" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="psw" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
    <a href="{% url 'onlinecourse:login' %}" class="btn btn-link">Already have an account?</a>
  </form>
</div>
</body>
</html>
